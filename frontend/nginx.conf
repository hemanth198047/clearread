server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # SPA: scripts/styles from self; connect to API/OIDC origins configured at image build time
  # (__CLEARREAD_API_ORIGIN__ / __CLEARREAD_OIDC_ORIGIN__ substituted in Dockerfile).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __CLEARREAD_API_ORIGIN__ __CLEARREAD_OIDC_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
