# Upstream API is the Compose service name `api` (container port 8080).
# Same-origin /v1 from the SPA avoids browser CORS and stale VITE_API_BASE_URL host ports.
upstream clearread_api {
  server api:8080;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # SPA: scripts/styles from self; connect to API/OIDC origins configured at image build time
  # (__CLEARREAD_API_ORIGIN__ / __CLEARREAD_OIDC_ORIGIN__ substituted in Dockerfile).
  # connect-src includes 'self' so same-origin /v1 proxy works without listing the API host.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __CLEARREAD_API_ORIGIN__ __CLEARREAD_OIDC_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /v1/ {
    proxy_pass http://clearread_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_pass_header Authorization;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
  }

  location /actuator/ {
    proxy_pass http://clearread_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
